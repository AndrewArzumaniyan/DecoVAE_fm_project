[project]
name = "decovaefm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "torch==2.5.1",
    "lightning>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "tqdm>=4.66.0",
    "hydra-core>=1.3.0",
    "mlflow>=2.14.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decovaefm*"]
